services:
  postgres:
    image: postgres:16-alpine
    container_name: pentestai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pentestai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pentestai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pentestai-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: pentestai-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/uploads

  frontend:
    build:
      context: ./frontend
    container_name: pentestai-frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
